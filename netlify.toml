[build]
  # Fresh install regenerates the lockfile on the Linux builder so the correct
  # @tailwindcss/oxide native binding is installed (npm bug #4828 otherwise
  # skips the Linux binary when the lockfile was generated on Windows).
  command = "rm -rf node_modules package-lock.json && npm install && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"